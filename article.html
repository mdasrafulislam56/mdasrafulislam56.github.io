const posts={"data-entry":["অনলাইনে Data Entry শেখার সহজ পথ: Beginner-দের পূর্ণ গাইড","অনলাইনে কাজ শেখার ক্ষেত্রে Data Entry নতুনদের কাছে একটি পরিচিত ক্ষেত্র। Typing accuracy, basic English, Excel বা Google Sheets, file management এবং online research-এর মতো দক্ষতা গুরুত্বপূর্ণ। প্রথমে typing ও basic computer skills অনুশীলন করুন। এরপর Excel বা Google Sheets-এর row, column, sorting, filtering, formatting এবং basic formulas শেখা উপকারী। নিজের দক্ষতা দেখানোর জন্য কয়েকটি sample কাজ তৈরি করে portfolio সাজানো যেতে পারে। Online কাজ খোঁজার সময় client, payment terms এবং platform rules যাচাই করুন এবং অগ্রিম টাকা বা সন্দেহজনক ব্যক্তিগত তথ্য চাওয়া হলে সতর্ক থাকুন।"],"job-checklist":["চাকরির আবেদন করার আগে যে বিষয়গুলো যাচাই করবেন: সহজ গাইড","চাকরির আবেদন করার আগে কয়েকটি গুরুত্বপূর্ণ বিষয় যাচাই করা প্রয়োজন। প্রথমে নিয়োগদাতা প্রতিষ্ঠান, পদের নাম, কাজের দায়িত্ব, শিক্ষাগত যোগ্যতা, অভিজ্ঞতার প্রয়োজনীয়তা এবং আবেদনের শেষ সময় ভালোভাবে পড়ে নিন। বিজ্ঞপ্তিটি সম্ভব হলে প্রতিষ্ঠানের অফিসিয়াল website বা নির্ভরযোগ্য নিয়োগ উৎস থেকে মিলিয়ে দেখুন। আবেদনের আগে নিজের CV, শিক্ষাগত সনদ, পরিচয়পত্র এবং প্রয়োজনীয় অন্যান্য তথ্য প্রস্তুত রাখুন। CV-তে ভুল তথ্য, অতিরঞ্জিত অভিজ্ঞতা বা যাচাই করা যায় না এমন দাবি ব্যবহার করা উচিত নয়। কোনো চাকরির জন্য অগ্রিম টাকা, OTP, password বা অপ্রয়োজনীয় সংবেদনশীল তথ্য চাওয়া হলে সতর্ক থাকুন। সন্দেহজনক email, website বা ব্যক্তিগত যোগাযোগের মাধ্যমে পাঠানো চাকরির প্রস্তাব গ্রহণের আগে প্রতিষ্ঠান ও বিজ্ঞপ্তির সত্যতা যাচাই করুন। আবেদনের শেষ তারিখ, যোগাযোগের মাধ্যম এবং interview-এর স্থান বা online meeting-এর তথ্য সংরক্ষণ করে রাখুন। একটি ভালো চাকরির আবেদন সাধারণত পরিষ্কার CV, সঠিক তথ্য এবং বিজ্ঞপ্তির প্রয়োজনীয়তার সঙ্গে মিল রেখে তৈরি করা হয়।"]};
